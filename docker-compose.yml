version: '3.8'

services:
  # PostgreSQL Database
  postgres:
    image: postgres:15-alpine
    container_name: watchdog-postgres
    environment:
      POSTGRES_USER: watchdog
      POSTGRES_PASSWORD: watchdog123
      POSTGRES_DB: watchdog
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./api/scripts/init.sql:/docker-entrypoint-initdb.d/init.sql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U watchdog"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - watchdog-network

  # Node.js API
  api:
    build:
      context: ./api
      dockerfile: Dockerfile
    container_name: watchdog-api
    environment:
      NODE_ENV: development
      PORT: 3000
      DATABASE_URL: postgresql://watchdog:watchdog123@postgres:5432/watchdog
      JWT_SECRET: your-super-secret-jwt-key-change-this-in-production
      AI_SERVICE_URL: http://ai-service:5000
      OPENAI_API_KEY: ${OPENAI_API_KEY:-sk-test}
    ports:
      - "3000:3000"
    depends_on:
      postgres:
        condition: service_healthy
    volumes:
      - ./api/src:/app/src
    command: npm run dev
    networks:
      - watchdog-network
    restart: unless-stopped

  # Python AI Service
  ai-service:
    build:
      context: ./ai-service
      dockerfile: Dockerfile
    container_name: watchdog-ai-service
    environment:
      PYTHON_ENV: development
      PORT: 5000
      OPENAI_API_KEY: ${OPENAI_API_KEY:-sk-test}
      OPENAI_MODEL: gpt-3.5-turbo
      OPENAI_TEMPERATURE: 0.7
    ports:
      - "5000:5000"
    volumes:
      - ./ai-service/src:/app/src
    command: python main.py
    networks:
      - watchdog-network
    restart: unless-stopped

volumes:
  postgres_data:
    driver: local

networks:
  watchdog-network:
    driver: bridge
